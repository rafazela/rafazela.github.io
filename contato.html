        </div>

        <h1>Deixe um<br>Comentário</h1>
        <br>

        <form class="contact-form" method="post">
          <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" placeholder="Seu nome">
          </div>
          <div class="form-group">
            <label for="mail">E-mail</label>
            <input type="email" id="mail" name="email" placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label for="msg">Mensagem</label>
            <textarea id="msg" name="message" placeholder="Escreva sua mensagem..."></textarea>
          </div>
          <button type="submit" class="cta-button">Enviar mensagem</button>
        </form>
      </div>
    </section>
